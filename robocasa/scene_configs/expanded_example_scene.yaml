# Absolute positions are world-frame contact points beneath object bounding
# boxes. Quaternions use wxyz order. Relations use world X/Y/Z axes.

# Workspace distances are robot-local: +forward points toward the island and
# +lateral points to the robot's left. The fixture also supplies the surface Z.

seed: null
device: keyboard
renderer: mjviewer
render_camera: null
show_walls: false

scene:
  environment: ConfiguredKitchen
  layout_id: 48
  style_id: 41

robot:
  type: PandaOmron
  base_fixture: island_island_group_1
  # Radians for Panda joints 1-7. This starts with the elbow up, arm extended
  # over the object workspace, and gripper pointing down.
  start_joints: [-0.085558, 0.231276, -0.066809, -1.315765, 0.015312, 1.546556, 0.530547]
  controller: null
  control_freq: 20

workspace:
  fixture: island_island_group_1
  # 22 x 22 inches, centered on the manipulation workspace.
  forward_range: [0.3456, 0.9044]
  lateral_range: [-0.2794, 0.2794]
  margin: 0.03

# Positions and look-at points are fixture-local offsets from the island center.
# The first two views flank the robot for close manipulation views. The third
# sits across the island and looks toward the front of the robot.
cameras:
  width: 1280
  height: 720
  depth: true
  placements:
    - name: robot_left
      fixture: island_island_group_1
      position: [-1.0, -0.12, 0.98]
      look_at: [0.0, -0.05, 0.55]
      fovy: 38
      roll: -7
    - name: robot_right
      fixture: island_island_group_1
      position: [1.0, -0.12, 0.98]
      look_at: [0.0, -0.05, 0.55]
      fovy: 38
      roll: 7
    - name: robot_and_counter
      fixture: island_island_group_1
      position: [0.0, 1.18, 1.27]
      look_at: [0.0, -0.35, 0.58]
      fovy: 36

objects:
  - name: avocado
    type: avocado
    style: 1
    placement:
      type: absolute
      absolute_position: [1.55, -3.9, 0.92]
      absolute_quat: [1.0, 0.0, 0.0, 0.0]

  - name: bagel
    type: bagel
    style: 1
    placement:
      type: relation
      relative_to: avocado
      relation:
        type: right
        distance_range: [0.03, 0.07]
        orthogonal_jitter_range: [-0.06, 0.06]

  - name: bagged_food
    type: bagged_food
    style: 1
    placement:
      type: relation
      relative_to: avocado
      relation:
        type: in_front_of
        distance_range: [0.03, 0.07]
        orthogonal_jitter_range: [-0.06, 0.06]

  - name: basket
    type: basket
    style: 1
    placement:
      type: relation
      relative_to: bagel
      relation:
        type: right
        distance_range: [0.03, 0.07]
        orthogonal_jitter_range: [-0.06, 0.06]

  - name: can
    type: can
    style: 1
    placement:
      type: relation
      relative_to: bagged_food
      relation:
        type: in_front_of
        distance_range: [0.03, 0.07]
        orthogonal_jitter_range: [-0.06, 0.06]

  - name: boxed_drink
    type: boxed_drink
    style: 1
    placement:
      type: random
